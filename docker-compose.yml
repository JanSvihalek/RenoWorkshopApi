# Provozní databáze. Port 5433 schválně, ať se nepere s případným
# Postgresem RenoDesku na 5432.
services:
  db:
    image: postgres:17-alpine
    container_name: renoworkshop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: renoworkshop
      POSTGRES_USER: renoworkshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastav POSTGRES_PASSWORD v .env}
    ports:
      - '5433:5432'
    volumes:
      - renoworkshop-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renoworkshop']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  renoworkshop-data:
